name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: @supabase/realtime-js requires the native global
          # WebSocket, which only exists in Node 22+. Node 20 throws
          # "Node.js 20 detected without native WebSocket support" when the
          # Supabase client loads, so the suite must run on 22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
