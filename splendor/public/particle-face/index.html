<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Splendor · Particle Face</title>
<meta name="description" content="Splendor's living face — thousands of glowing particles that reassemble into expressions and speech.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%2336e6ff'/%3E%3C/svg%3E">
<style>
  :root { --ink:#bfe9ff; --line:rgba(80,180,255,.35); }
  html,body{margin:0;height:100%;background:#01060d;color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body.transparent,html.transparent{background:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* control deck */
  #panel{position:fixed;left:14px;top:env(safe-area-inset-top,14px);z-index:10;
    display:flex;flex-direction:column;gap:10px;max-width:min(86vw,300px);
    padding:14px;border:1px solid var(--line);border-radius:16px;
    background:rgba(4,12,22,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(0,0,0,.5);transition:opacity .35s,transform .35s}
  #panel.hidden{opacity:0;transform:translateX(-20px);pointer-events:none}
  .brand{font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase;
    color:#eaf7ff;display:flex;align-items:center;gap:8px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:#36e6ff;
    box-shadow:0 0 12px #36e6ff}
  .grp{display:flex;flex-direction:column;gap:6px}
  .lab{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#5a86a8}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:11px;letter-spacing:.5px;color:#bfe9ff;cursor:pointer;
    background:rgba(10,26,42,.7);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;text-transform:capitalize;transition:.15s}
  button:hover{background:rgba(16,44,70,.85);border-color:#37b6ff}
  button.on{background:#06324d;border-color:#36e6ff;color:#d9f6ff;
    box-shadow:0 0 14px rgba(54,230,255,.4)}
  .swatch{width:26px;height:26px;padding:0;border-radius:8px}
  input[type=range]{width:100%;accent-color:#36e6ff}
  #speak{display:flex;gap:6px}
  #speak input{flex:1;min-width:0;background:rgba(10,26,42,.7);border:1px solid var(--line);
    border-radius:10px;color:#dff;padding:7px 9px;font:inherit;font-size:11px}
  #fps{position:fixed;right:12px;bottom:10px;z-index:10;font-size:10px;color:#3c6a8c;
    letter-spacing:.5px;font-variant-numeric:tabular-nums}
  #toggle{position:fixed;left:14px;bottom:14px;z-index:11;display:none}
  #err{position:fixed;inset:auto 0 0 0;background:#400;color:#fee;padding:10px 14px;
    font:12px/1.4 monospace;display:none;white-space:pre-wrap;z-index:99}
  #err.show{display:block}
  body.obs #panel,body.obs #fps,body.obs #toggle{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="panel">
  <div class="brand"><span class="dot"></span> Splendor · Particle Face</div>

  <div class="grp">
    <div class="lab">Expression</div>
    <div class="row" id="expr"></div>
  </div>

  <div class="grp">
    <div class="lab">Theme</div>
    <div class="row" id="theme"></div>
  </div>

  <div class="grp">
    <div class="lab">Voice</div>
    <div id="speak">
      <input id="text" type="text" value="Hello. I am Splendor — an intelligence made of light." />
      <button id="bSay">Say</button>
    </div>
    <div class="row">
      <button id="bMic">🎙 Mic</button>
      <button id="bBlink">Blink</button>
      <button id="bOrbit">Orbit</button>
      <button id="bAlpha">OBS / Alpha</button>
    </div>
  </div>

  <div class="grp">
    <div class="lab">Particles · <span id="cval">—</span></div>
    <input id="count" type="range" min="4000" max="50000" step="1000" value="22000" />
  </div>
</div>

<button id="toggle">☰</button>
<div id="fps"></div>
<div id="err"></div>

<script>
window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.textContent = 'ERROR: ' + (e.message || e) + (e.error && e.error.stack ? '\n' + e.error.stack : '');
  el.classList.add('show');
});
</script>

<script type="module">
import { SplendorFace, THEMES, EXPRESSIONS } from './splendor-face.js';

const qp = new URLSearchParams(location.search);
const obs = qp.has('obs');
const startTheme = qp.get('theme') || 'cyan';
const startExpr = qp.get('expression') || 'neutral';
const startCount = parseInt(qp.get('count') || '', 10);
const transparent = obs || qp.has('transparent');
const orbit = qp.has('orbit');

if (transparent) { document.documentElement.classList.add('transparent'); document.body.classList.add('transparent'); }
if (obs) document.body.classList.add('obs');

const face = new SplendorFace(document.getElementById('c'), {
  theme: startTheme,
  expression: startExpr,
  transparent,
  orbit,
  count: Number.isFinite(startCount) ? startCount : undefined,
});
window.face = face;

/* ---- build expression buttons ---- */
const exprWrap = document.getElementById('expr');
let exprBtns = {};
EXPRESSIONS.forEach((name) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.className = name === startExpr ? 'on' : '';
  b.onclick = () => {
    face.setExpression(name);
    Object.values(exprBtns).forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
  };
  exprBtns[name] = b;
  exprWrap.appendChild(b);
});

/* ---- theme swatches ---- */
const themeWrap = document.getElementById('theme');
Object.entries(THEMES).forEach(([name, t]) => {
  const b = document.createElement('button');
  b.className = 'swatch' + (name === startTheme ? ' on' : '');
  b.title = name;
  b.style.background = '#' + t.core.toString(16).padStart(6, '0');
  b.style.boxShadow = '0 0 12px #' + t.core.toString(16).padStart(6, '0');
  b.onclick = () => {
    face.setTheme(name);
    [...themeWrap.children].forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
  };
  themeWrap.appendChild(b);
});

/* ---- voice + toggles ---- */
const $ = (id) => document.getElementById(id);
$('bSay').onclick = () => face.speak($('text').value);
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') face.speak($('text').value); });

const bMic = $('bMic');
bMic.onclick = async () => {
  if (face._audio.kind === 'mic') { face.detachAudio(); bMic.classList.remove('on'); return; }
  const ok = await face.attachMic();
  bMic.classList.toggle('on', ok);
};
$('bBlink').onclick = () => face.blink();

const bOrbit = $('bOrbit');
bOrbit.classList.toggle('on', orbit);
bOrbit.onclick = () => { face.setOrbit(!face.orbit); bOrbit.classList.toggle('on', face.orbit); };

const bAlpha = $('bAlpha');
bAlpha.classList.toggle('on', transparent);
bAlpha.onclick = () => {
  const on = !face.transparent;
  face.setTransparent(on);
  document.body.classList.toggle('transparent', on);
  document.documentElement.classList.toggle('transparent', on);
  bAlpha.classList.toggle('on', on);
};

/* ---- particle count ---- */
const count = $('count'), cval = $('cval');
count.value = face.count; cval.textContent = face.count.toLocaleString();
let rebuildT;
count.oninput = () => {
  cval.textContent = (+count.value).toLocaleString();
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => face.setQuality(+count.value), 180);
};

/* ---- panel show/hide (small screens) ---- */
const panel = $('panel'), toggle = $('toggle');
if (window.innerWidth < 560 && !obs) { panel.classList.add('hidden'); toggle.style.display = 'block'; }
toggle.onclick = () => panel.classList.toggle('hidden');

/* ---- fps + graceful degradation ---- */
const fps = $('fps');
let frames = 0, acc = 0, lastT = performance.now(), low = 0, degraded = false;
(function meter() {
  const now = performance.now(); acc += now - lastT; lastT = now; frames++;
  if (acc >= 500) {
    const f = Math.round((frames * 1000) / acc);
    if (!obs) fps.textContent = f + ' fps · ' + face.n.toLocaleString() + ' pts';
    // auto-reduce once if a weaker GPU is struggling
    if (f < 45 && face.count > 8000) { if (++low >= 4 && !degraded) { degraded = true; face.setQuality(Math.round(face.count * 0.6)); count.value = face.count; cval.textContent = face.count.toLocaleString(); } }
    else low = Math.max(0, low - 1);
    frames = 0; acc = 0;
  }
  requestAnimationFrame(meter);
})();

/* ---- gentle opening: a short greeting so the rig visibly lives ---- */
if (!obs && !qp.has('silent')) {
  setTimeout(() => { try { face.speak('Hello.'); } catch (_) {} }, 700);
}
</script>
</body>
</html>
