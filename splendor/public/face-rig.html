<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dot face rig — demo</title>
<style>
  html,body{margin:0;background:#000;color:#9ef;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;width:100%;height:100%}
  #stage{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;top:env(safe-area-inset-top,0);right:0;display:flex;flex-direction:column;gap:6px;padding:12px;z-index:9;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  button{background:rgba(8,18,28,.85);color:#aef;border:1px solid #0bf6;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;text-transform:uppercase;letter-spacing:.6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  button:hover{background:rgba(11,34,54,.85)}
  button.on{background:#024;border-color:#0ff;color:#0ff;box-shadow:0 0 14px rgba(0,229,255,.45)}
  #hint{position:fixed;left:12px;bottom:12px;font-size:10px;color:#456;letter-spacing:.4px;max-width:60vw}
  #hint code{color:#7df}
  #err{position:fixed;left:0;right:0;bottom:0;background:#400;color:#fee;padding:10px 14px;font:12px/1.4 monospace;display:none;white-space:pre-wrap;z-index:99}
  #err.show{display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <button id="bSpeak">Speak demo</button>
  <button id="bTalk" class="on">Procedural</button>
  <button id="bBlink">Blink</button>
  <button id="bSway" class="on">Head sway</button>
  <button id="bMic">Mic → mouth</button>
</div>
<div id="hint">Reusable module: <code>face-rig.js</code> · <code>new DotFace(canvas)</code> · <code>.attachAudio(el)</code>, <code>.speak(text)</code>, <code>.driveAmplitude(v)</code></div>
<div id="err"></div>

<script>
window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  if (el) { el.textContent = 'ERROR: ' + (e.message || e) + (e.error && e.error.stack ? '\n' + e.error.stack : ''); el.classList.add('show'); }
});
</script>
<script src="/face-rig.js"></script>
<script>
function boot() {
  const face = new DotFace(document.getElementById('c'), { autoplay: true });
  window.face = face;
  // Auto-demo: it speaks a line on open so the rig visibly works.
  setTimeout(() => {
    if (face.audio.kind) return; // user already attached audio/mic
    try { face.speak("Hi. I'm a talking head you can wire into your custom AI build."); } catch (_) {}
  }, 600);
  setTimeout(() => { if (!face.audio.kind && !speechSynthesis.speaking) { face.stopTalking(); document.getElementById('bTalk').classList.remove('on'); } }, 9000);

  const $ = (id) => document.getElementById(id);
  $('bSpeak').addEventListener('click', () => face.speak("Hello. Wire me to any voice — html audio, the mic, or push amplitudes from your t.t.s pipeline."));
  $('bBlink').addEventListener('click', () => face.blink());
  const bTalk = $('bTalk');
  bTalk.addEventListener('click', () => { if (face.talking) { face.stopTalking(); bTalk.classList.remove('on'); } else { face.startTalking(); bTalk.classList.add('on'); } });
  const bSway = $('bSway');
  bSway.addEventListener('click', () => { face.setSway(!face.sway); bSway.classList.toggle('on', face.sway); });
  const bMic = $('bMic');
  bMic.addEventListener('click', async () => {
    if (face.audio.kind === 'stream') { face.detachAudio(); face.stopTalking(); bMic.classList.remove('on'); bTalk.classList.remove('on'); return; }
    const ok = await face.attachMic();
    if (ok) { bMic.classList.add('on'); bTalk.classList.add('on'); }
  });
}
if (document.readyState === 'complete' || document.readyState === 'interactive') requestAnimationFrame(boot);
else document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(boot));
</script>
</body>
</html>
